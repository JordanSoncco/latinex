<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latinex - Compilador a PDF</title>
    <!-- Vue.js CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.2rem 2rem;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            gap: 1rem;
        }

        .left-panel {
            border-right: 1px solid var(--border);
        }

        .toolbar {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: var(--text-muted);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            box-shadow: none;
        }
        
        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        .editor {
            flex: 1;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.5rem;
            color: #e2e8f0;
            font-family: 'Fira Code', monospace;
            font-size: 15px;
            resize: none;
            outline: none;
            line-height: 1.6;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .editor:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .preview-container {
            flex: 1;
            background-color: #f8fafc;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--bg-dark);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: white;
        }

        .empty-state {
            color: #64748b;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .empty-state p {
            font-weight: 500;
        }
        
        .image-list {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        
        .image-badge {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(4px);
        }
        
        .image-badge button {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        
        .image-badge button:hover {
            background: #ef4444;
            color: white;
        }
        
        .session-badge {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>Latinex</h1>
            <div class="session-badge">
                ID Sesión: <span style="font-family: 'Fira Code', monospace; color: var(--text-main);">{{ sessionId }}</span>
            </div>
        </header>

        <div class="main-container">
            <!-- Panel Izquierdo: Editor y Controles -->
            <div class="panel left-panel">
                <div class="toolbar">
                    <button class="btn" @click="compilar" :disabled="isCompiling">
                        <svg v-if="!isCompiling" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg v-else xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                        {{ isCompiling ? 'Compilando...' : 'Compilar Documento' }}
                    </button>
                    <div class="file-input-wrapper">
                        <button class="btn btn-outline">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            Adjuntar Imagen
                        </button>
                        <input type="file" @change="handleFileUpload" accept="image/*" multiple>
                    </div>
                </div>
                
                <div v-if="images.length > 0" class="image-list">
                    <div v-for="(img, index) in images" :key="index" class="image-badge">
                        {{ img.name }}
                        <button @click="removeImage(index)" title="Quitar imagen">&times;</button>
                    </div>
                </div>

                <textarea class="editor" v-model="codigoFuente" spellcheck="false" placeholder="Escribe tu código Latinex aquí...
Ejemplo:
#titulo(size=24){Mi Primer Documento}
#texto{Este es un párrafo de prueba.}"></textarea>
            </div>

            <!-- Panel Derecho: Previsualización -->
            <div class="panel right-panel">
                <div class="preview-container">
                    <iframe v-if="pdfUrl" :src="pdfUrl"></iframe>
                    <div v-else class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.3;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <p>La previsualización del documento aparecerá aquí</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="app.js"></script>
</body>
</html>
