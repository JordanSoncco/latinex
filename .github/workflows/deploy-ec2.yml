name: Deploy LATINEX Cloud to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: latinex-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Update EC2 via AWS SSM
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC (sin llaves permanentes)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::462263708052:role/LatinexGitHubDeployRole
          aws-region: us-east-2

      - name: Deploy latest main to latinex-overleaf-prod via SSM
        run: |
          set -euo pipefail
          REGION="us-east-2"
          INSTANCE_ID="$(aws ec2 describe-instances \
            --region "$REGION" \
            --filters "Name=tag:Name,Values=latinex-overleaf-prod" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)"

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "ERROR: No se encontró una instancia en ejecución llamada latinex-overleaf-prod en $REGION." >&2
            exit 1
          fi

          echo "Desplegando en instancia: $INSTANCE_ID"

          SSM_PARAMS='{"commands":["set -euo pipefail","export HOME=/root","cd /opt/latinex","git fetch origin main","git reset --hard origin/main","docker build -t latinex-app .","docker compose up -d --no-build","for k in $(seq 1 20); do curl -fsS http://127.0.0.1/auth.php?action=me >/dev/null && break; sleep 3; done","docker compose ps"]}'
          CMD_ID="$(aws ssm send-command \
            --region "$REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$SSM_PARAMS" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM CommandId: $CMD_ID"

          for _ in $(seq 1 60); do
            sleep 4
            INV_JSON="$(aws ssm get-command-invocation \
              --region "$REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || true)"
            [[ -z "$INV_JSON" ]] && continue
            STATUS="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("Status",""))' "$INV_JSON")"
            if [[ "$STATUS" == "Success" ]]; then
              python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("StandardOutputContent",""))' "$INV_JSON"
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("StandardOutputContent","")); print(d.get("StandardErrorContent",""))' "$INV_JSON" >&2
              exit 1
            fi
          done

          echo "ERROR: Tiempo de espera agotado esperando SSM." >&2
          exit 1
